name: CI

on:
  push:
    branches: [main, dev, 'codex/**', 'claude/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Safety and unit verification
        run: pnpm ci:verify

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Upload static export for local verification
        uses: actions/upload-artifact@v7
        with:
          name: public-static-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 1
